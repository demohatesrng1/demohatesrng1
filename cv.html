<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CV · Dhruv (Demo)</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#3b3b3b" />
  <meta name="color-scheme" content="dark" />
  <link rel="alternate" hreflang="en" href="https://demohatesrng1.github.io/demohatesrng1/cv.html" />
  <link rel="alternate" hreflang="ja" href="https://demohatesrng1.github.io/demohatesrng1/ja/cv.html" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <noscript><meta http-equiv="refresh" content="0; url=Dhruv-CV.pdf" /></noscript>
  <script>
    // Open the PDF in place; if it hasn't been uploaded yet, say so instead of a 404.
    (function () {
      var pdf = 'Dhruv-CV.pdf';
      fetch(pdf, { method: 'HEAD', cache: 'no-store' })
        .then(function (r) { r.ok ? location.replace(pdf) : document.documentElement.classList.add('cv-missing'); })
        .catch(function () { location.replace(pdf); });
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic&text=%E3%83%87%E3%83%A2&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="note-page">
  <div class="page-shell">
    <header class="topbar">
      <div class="topbar__identity">
        <p class="topbar__name"><a href="./" style="text-decoration:none">Dhruv</a><span class="topbar__kana" lang="ja">デモ</span></p>
      </div>
      <div class="topbar__right">
        <nav class="lang" aria-label="Language">
          <a href="cv.html" hreflang="en" lang="en" aria-current="page">EN</a>
          <a href="ja/cv.html" hreflang="ja" lang="ja">日本語</a>
        </nav>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="cv-opening">
          <h1>Opening my CV…</h1>
          <p class="hero__lead">If it doesn’t open by itself, <a href="Dhruv-CV.pdf">open the PDF here</a>.</p>
        </div>
        <div class="cv-later">
          <h1>My CV is being updated</h1>
          <p class="hero__lead">A new version will be here soon. Until then, <a href="mailto:onidemorng@gmail.com">email me</a> and I’ll send you a copy.</p>
        </div>
        <div class="hero__meta-links"><a href="./">← Back home</a></div>
      </section>
    </main>
  </div>
</body>
</html>
